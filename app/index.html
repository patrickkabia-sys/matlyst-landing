<!--
  Én lenke for all reklame: matlyst-app.no/app
  iPhone/iPad går rett til App Store, Android rett til Play. Alt annet (PC,
  ukjent) får begge knappene. Lenkene har ingen landkode, så butikken åpner i
  brukerens eget land: samme lenke virker på norsk, engelsk og alle andre språk.

  Kilde: legg på ?k=<kilde>, f.eks. /app?k=ig-en. Den går til Apple som ct= og
  til Play som utm_source i install-referreren.

  Med vilje UTEN locale.js (den videresender etter språk og ville stoppet
  hoppet), uten site.js og uten sporing: siden skal være borte før noe rekker å
  lastes, og en ren videresending trenger ikke samtykke.
-->
<script>
(function () {
  var APP_STORE = 'https://apps.apple.com/app/matlyst/id6762563515';
  var PLAY = 'https://play.google.com/store/apps/details?id=app.matlyst';

  // Kun trygge tegn fra adresselinja, så ingen kan bygge en lenke som
  // smugler noe inn i butikk-URL-en.
  var m = /[?&]k=([a-z0-9_-]{1,40})(?:&|$)/i.exec(location.search);
  var kilde = m ? m[1].toLowerCase() : 'app-lenke';

  var ios = APP_STORE + '?ct=' + kilde;
  var android = PLAY + '&referrer=' + encodeURIComponent('utm_source=' + kilde + '&utm_medium=app-lenke');

  var ua = navigator.userAgent || '';
  // iPad med iPadOS 13+ later som den er en Mac; berøring avslører den.
  var erIos = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  var erAndroid = /Android/.test(ua);

  if (erIos) { location.replace(ios); return; }
  if (erAndroid) { location.replace(android); return; }

  document.addEventListener('DOMContentLoaded', function () {
    document.getElementById('btn-ios').href = ios;
    document.getElementById('btn-android').href = android;
  });
})();
</script>
<style>
  :root{--cream:#F7F3EC;--ink:#1E1813;--ink-soft:#5C5047}

  .stores{display:flex;flex-direction:column;gap:12px;width:100%;max-width:320px}
  a.store{display:block;text-decoration:none;background:var(--ink);color:var(--cream);border-radius:14px;padding:15px 20px;font-size:16px;font-weight:500}
</style>

    <a class="store" id="btn-android" href="https://play.google.com/store/apps/details?id=app.matlyst&amp;referrer=utm_source%3Dapp-lenke%26utm_medium%3Dapp-lenke">Google Play (Android)</a>
  </div>
