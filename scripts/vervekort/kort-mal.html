<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<title>Vervekort-mal</title>
<!--
  Mal for OG-bildene til vervekortet (1200 × 630). Ikke en side: render.mjs åpner
  fila lokalt, fyller tittelen per språk med textContent og tar skjermbilde.
  Farger fra appens lyse tema (constants/colors.gen.ts i app-repoet):
  background #F6F3EF, text #1A1714, textSecondary #69645E, accentText #BD3F00.
  Logoen er ml.-logoen fra app-repoets origin/master (assets/icon.svg), uten bakgrunn.
-->
<style>
@font-face{font-family:'Fraunces';font-weight:300 500;src:url(../../fonts/fraunces-latin.woff2) format('woff2')}
@font-face{font-family:'Fraunces';font-style:italic;font-weight:300 400;src:url(../../fonts/fraunces-italic-latin.woff2) format('woff2')}
@font-face{font-family:'DM Sans';font-weight:300 600;src:url(../../fonts/dm-sans-latin.woff2) format('woff2')}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{background:#F6F3EF;color:#1A1714;font-family:'DM Sans',sans-serif;display:grid;grid-template-columns:700px 500px}
.tekst{padding:64px 56px 56px 72px;display:flex;flex-direction:column;justify-content:space-between}
.logo{width:150px;height:auto;display:block}
h1{font-family:'Fraunces',serif;font-weight:400;font-size:68px;line-height:1.04;letter-spacing:-0.02em}
h1 em{font-style:italic;font-weight:300;color:#BD3F00}
.domene{font-size:24px;font-weight:500;color:#69645E;letter-spacing:.01em}
.bilde{width:500px;height:630px;object-fit:cover;object-position:50% 50%;display:block}
</style>
</head>
<body>
<div class="tekst">
  <svg class="logo" viewBox="190 300 620 380" role="img" aria-label="Matlyst"><path d="M 220.6 638.9 C 235.0 574.9 246.2 514.9 265.4 479.7 C 281.4 450.9 300.6 442.9 313.4 442.9 C 335.8 442.9 348.6 463.7 348.6 502.9 V 638.9 C 348.6 538.9 374.2 442.9 412.6 442.9 C 451.0 442.9 460.6 486.9 460.6 534.9 V 574.9 C 460.6 626.9 484.6 652.5 521.4 648.5 C 588.6 639.7 640.6 543.7 640.6 431.7 C 640.6 359.7 609.4 327.7 583.0 327.7 C 552.6 327.7 539.8 375.7 539.8 439.7 C 539.8 519.7 547.8 582.1 563.8 616.5 C 578.2 646.9 600.6 654.9 624.6 651.7 C 643.8 649.3 659.8 640.5 674.2 627.7" fill="none" stroke="#0C0A08" stroke-width="52.0" stroke-linecap="round" stroke-linejoin="round"/><circle cx="772.6" cy="634.9" r="32.8" fill="#FF5500"/></svg>
  <h1 id="tittel"></h1>
  <p class="domene" id="domene"></p>
</div>
<img class="bilde" src="tomatpasta.jpg" alt="">
</body>
</html>
