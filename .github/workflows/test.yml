name: Tester

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Hent kildekoden
        uses: actions/checkout@v4

      - name: Sett opp Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer avhengigheter
        run: npm ci

      - name: Installer Chromium
        run: npx playwright install --with-deps chromium

      - name: Kjør enhetstester
        run: npm test

      - name: Kjør Playwright
        run: npm run test:e2e
