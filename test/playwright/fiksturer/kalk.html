<header class="locale-page-hero"><p class="eyebrow">Verktøy</p><h1 class="disp">Fikstur for kalkulatorkortet</h1><p class="lead">To skjemaer: fast vare, og varevalg.</p>
<form class="kalk" id="fast" data-kalk="volumvekt" onsubmit="return false" aria-label="Kalkulator: desiliter til gram">

    <div class="kalkside">
      <label class="kalktall"><span class="skjult">Mengde</span><input data-felt="mengde" type="text" inputmode="decimal" autocomplete="off" value="2"></label>
      <label class="kalkenhet"><span class="skjult">Fra</span><select data-felt="fra"><option value="dl" selected>Desiliter (dl)</option><option value="ss">Spiseskjeer (ss)</option><option value="ts">Teskjeer (ts)</option><option value="ml">Milliliter (ml)</option><option value="l">Liter (l)</option><option value="cups">Amerikanske cups</option><option value="g">Gram (g)</option><option value="kg">Kilo (kg)</option></select><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg></label>
    </div>
    <button type="button" class="bytt" data-felt="bytt" aria-label="Bytt retning"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4L3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"></path></svg></button>
    <div class="kalkside til">
      <output class="kalktall" data-felt="svar">110</output>
      <label class="kalkenhet"><span class="skjult">Til</span><select data-felt="til"><option value="dl">Desiliter (dl)</option><option value="ss">Spiseskjeer (ss)</option><option value="ts">Teskjeer (ts)</option><option value="ml">Milliliter (ml)</option><option value="l">Liter (l)</option><option value="cups">Amerikanske cups</option><option value="g" selected>Gram (g)</option><option value="kg">Kilo (kg)</option></select><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg></label>
    </div>
  </div>
  <div class="hurtig" role="group" aria-label="Vanlige mengder"><button type="button" data-v="0,5">0,5 dl</button><button type="button" data-v="1">1 dl</button><button type="button" data-v="2">2 dl</button><button type="button" data-v="3">3 dl</button><button type="button" data-v="5">5 dl</button><button type="button" data-v="10">10 dl</button></div>
  <p class="kalksetning" data-felt="setning" role="status" aria-live="polite">2 dl hvetemel = 110 g</p>

</form>
